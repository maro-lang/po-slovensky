<!DOCTYPE html>
<!--
  index.html — Entry page of the Slovak learning app ("Po slovensky", working title).

  What it does: loads the styles and the scripts, and gives them an empty
  <main> element where every screen is drawn.

  How to use: open it through a web server (GitHub Pages, the Lanzador or
  `python3 -m http.server`). Opening it as a file also works, but then the
  app cannot work offline (service workers need http or https).

  Depends on: css/styles.css, js/*.js, manifest.webmanifest, sw.js, icons/.
  The scripts are plain (non-module) scripts and must load in the order below,
  because each one uses what the previous ones defined.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Po slovensky</title>
  <meta name="description" content="Aprende eslovaco desde castellano o inglés, de A1 a B1.">
  <!-- Colour of the phone's status bar: same as the page background (light / dark) -->
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Every screen is drawn inside this element by js/screens.js -->
  <main id="app" aria-live="polite"></main>

  <!-- ===== Scripts (order matters) ===== -->
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/modules-list.js"></script>
  <script src="js/ui.js"></script>
  <!-- Learning content (data only) -->
  <script src="js/data/cases.js"></script>
  <script src="js/data/pronunciation.js"></script>
  <script src="js/data/lessons-a1.js"></script>
  <script src="js/data/vocabulary.js"></script>
  <script src="js/srs.js"></script>
  <!-- Screens: shared ones first, then one file per module -->
  <script src="js/screens.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/screens-cases.js"></script>
  <script src="js/screens-pronunciation.js"></script>
  <script src="js/screens-lessons.js"></script>
  <script src="js/screens-review.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
